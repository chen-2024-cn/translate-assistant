name: Windows regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Check source release configuration
        run: python scripts/check_release.py
      - name: Run mocked-network regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

name: Windows regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Source Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Check interpreter
        run: python python_runtime.py
      - name: Install compatible binary dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check source release configuration
        run: python scripts/check_release.py
      - name: Run mocked-network regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
      - name: Open actual Windows Qt diagnostic window
        run: python scripts/diagnose_qt.py
      - name: Record resolved versions
        run: python -m pip freeze

  pinned:
    name: Pinned build baseline Python 3.14
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install fixed build-baseline runtime dependencies
        run: >-
          python -m pip install --only-binary=:all: -r requirements.lock.txt
      - name: Run mocked-network regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
      - name: Check fixed-baseline Qt window startup
        run: python scripts/diagnose_qt.py
